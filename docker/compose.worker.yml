services:
  jwt-worker:
    image: amtgard-idp-jwt-worker:latest
    container_name: amtgard-idp-jwt-worker
    hostname: amtgard-idp-jwt-worker
    restart: unless-stopped
    stop_grace_period: 15s
    working_dir: /var/www/idp.amtgard.com
    command: ["php", "-d", "memory_limit=256M", "/var/www/idp.amtgard.com/bin/jwt-pvh-worker.php"]
    env_file:
      - .env
    environment:
      - HOST_ENV_SECRETS_DIR=/run/secrets
    volumes:
      - ./.env:/var/www/idp.amtgard.com/.env:ro
      - ${IDP_HEV_WORKER_SECRETS:-./.local/empty-secrets}:/run/secrets:ro
      - ${IDP_LEGACY_DEV_KEYS:-./.local/empty-secrets}:/var/www/idp.amtgard.com/dev-keys:ro
      - ${IDP_LEGACY_KEYS:-./.local/empty-secrets}:/var/www/idp.amtgard.com/keys:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - amtgard-idp-shared

networks:
  amtgard-idp-shared:
    name: amtgard-idp-shared
    external: true
