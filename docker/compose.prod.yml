services:
  amtgardidpapp:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    working_dir: /var/www
    volumes:
      - .:/var/www/idp.amtgard.com
    env_file: .prod.env
    environment:
      - ENVIRONMENT=PROD
    networks:
      - amtgard-idp-net

networks:
  amtgard-idp-net:
