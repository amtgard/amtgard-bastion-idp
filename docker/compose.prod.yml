services:
  amtgardidpapp:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    working_dir: /var/www
    volumes:
      # App code is copied into the image so each slot keeps its own release.
      # Only host secrets/config are shared across blue/green.
      - ./.env:/var/www/idp.amtgard.com/.env:ro
      - ./dev-keys:/var/www/idp.amtgard.com/dev-keys:ro
      - ./keys:/var/www/idp.amtgard.com/keys:ro
    env_file:
      - .env
    environment:
      - ENVIRONMENT=PROD
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - amtgard-idp-net
      - amtgard-idp-shared

networks:
  amtgard-idp-net:
  amtgard-idp-shared:
    name: amtgard-idp-shared
    external: true
