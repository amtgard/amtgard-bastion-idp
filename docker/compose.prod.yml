services:
  amtgardidpapp:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    working_dir: /var/www
    volumes:
      - .:/var/www/idp.amtgard.com
    env_file:
      - .env
    environment:
      - ENVIRONMENT=PROD
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - amtgard-idp-net
      - amtgard-idp-shared

networks:
  amtgard-idp-net:
  amtgard-idp-shared:
    name: amtgard-idp-shared
    external: true
