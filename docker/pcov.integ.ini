; FPM-only integ coverage (mounted by compose.integ-coverage.yml). Xdebug stays loaded but off so PCOV can run.
xdebug.mode=off

extension=pcov.so
pcov.enabled=1
pcov.directory=/var/www/idp.amtgard.com/src
pcov.exclude="~vendor~"

auto_prepend_file=/var/www/idp.amtgard.com/scripts/integ-coverage-fpm-prepend.php
