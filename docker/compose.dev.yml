name: amtgard-idp

services:
  amtgardidpapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "37080:80"
      - "41093:9003"
    working_dir: /var/www
    volumes:
      - ..:/var/www/idp.amtgard.com
    env_file:
      - ../.env
    environment:
      - ENVIRONMENT=DEV
    container_name: amtgard-idp
    depends_on:
      - amtgardidpdb
    networks:
      - amtgard-idp-net
    hostname: amtgard-idp-app

  jwt-worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    working_dir: /var/www/idp.amtgard.com
    volumes:
      - ..:/var/www/idp.amtgard.com
    env_file:
      - ../.env
    environment:
      - ENVIRONMENT=DEV
    command: ["php", "-d", "memory_limit=256M", "bin/jwt-pvh-worker.php"]
    depends_on:
      - amtgardidpapp
      - amtgardidpdb
    # Share the app container network so 127.0.0.1 Redis from heartbeat.sh is reachable.
    network_mode: "service:amtgardidpapp"
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    working_dir: /var/www/idp.amtgard.com
    volumes:
      - ..:/var/www/idp.amtgard.com
    env_file:
      - ../.env
    environment:
      - ENVIRONMENT=DEV
    entrypoint: ["bash", "-lc"]
    command: ["composer test"]
    depends_on:
      - amtgardidpdb
    networks:
      - amtgard-idp-net

  amtgardidpdb:
    image: mariadb:latest
    restart: always
    environment:
      MARIADB_DATABASE: idp
      MARIADB_USER: idp
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "36306:3306"
    expose:
      - "3306"
    volumes:
      - data-db:/var/lib/mysql
    container_name: amtgard-idp-db
    networks:
      - amtgard-idp-net
    hostname: amtgard-idp-db

volumes:
  data-db: {}

networks:
  amtgard-idp-net:
