# Overlay on compose.prod.yml + compose.blue.yml. Start with scripts/dev-up.sh.
name: amtgard-idp

services:
  amtgardidpapp:
    image: amtgard-idp-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "41093:9003"
    volumes:
      - .:/var/www/idp.amtgard.com
    environment:
      - ENVIRONMENT=DEV
    container_name: amtgard-idp
    hostname: amtgard-idp
    depends_on:
      - amtgardidpdb

  test:
    profiles: ["test"]
    image: amtgard-idp-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /var/www/idp.amtgard.com
    volumes:
      - .:/var/www/idp.amtgard.com
    env_file:
      - .env
    environment:
      - ENVIRONMENT=DEV
      - XDEBUG_MODE=off
    entrypoint: ["bash", "-lc"]
    command: ["composer test"]
    depends_on:
      - amtgardidpdb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - amtgard-idp-net

  amtgardidpdb:
    image: mariadb:latest
    restart: always
    environment:
      MARIADB_DATABASE: idp
      MARIADB_USER: idp
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "36306:3306"
    expose:
      - "3306"
    volumes:
      - data-db:/var/lib/mysql
    container_name: amtgard-idp-db
    hostname: amtgard-idp-db
    networks:
      - amtgard-idp-net

volumes:
  data-db:
    name: amtgard-idp_data-db

networks:
  amtgard-idp-net:
    name: amtgard-idp-net
