services:
  amtgardidpapp:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "37080:80"
      - "41093:9003"
    working_dir: /var/www
    volumes:
      - .:/var/www/idp.amtgard.com
    env_file: .dev.env
    environment:
      - ENVIRONMENT=DEV
    container_name: amtgard-idp
    networks:
      - amtgard-idp-net
    hostname: amtgard-idp-app

  amtgardidpdb:
    image: mariadb:latest
    restart: always
    environment:
      MARIADB_DATABASE: idp
      MARIADB_USER: idp
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "36306:3306"
    expose:
      - "3306"
    volumes:
      - data-db:/var/lib/mysql
    container_name: amtgard-idp-db
    networks:
      - amtgard-idp-net
    hostname: amtgard-idp-db

volumes:
  data-db: {}

networks:
  amtgard-idp-net:
