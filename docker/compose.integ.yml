# Overlay on compose.prod.yml + compose.blue.yml + compose.dev.yml (see scripts/integ-up.sh).
# DEV integration: dedicated MariaDB + session Redis (compose.integ-infra.yml), fake outbound HTTP.
name: amtgard-idp

services:
  amtgardidpapp:
    environment:
      ENVIRONMENT: DEV_INTEG
      DB_HOST: amtgard-idp-db-integ
      DB_NAME: idp
      SESSION_REDIS_HOST: amtgard-idp-sessions-integ
      REDIS_PUBSUB_HOST: amtgard-idp-sessions-integ
      REDIS_PUBSUB_PORT: "6379"
      REDIS_PUBSUB_DB: "0"
      REDIS_PUBSUB_QUEUE_NAME: integ-amtgard-idp
      REDIS_PVH_QUEUE_NAME: integ-amtgard-idp-pvh
      APPLE_LOGIN_ENABLED: "true"
      APPLE_KEY_FILE_PATH: /var/www/idp.amtgard.com/tests/fixtures/integ-apple-es256.pem
      SESSION_REDIS_PREFIX: "INTEGSESS:"
      MANAGEMENT_KEY: integ-management-key-thirty-two-chars
      LINK_ORK_PROFILE_ALLOWED_CLIENT_IDS: integ_confidential
      IDP_ORK_SHARED_SECRET: integ-ork-shared-secret-thirty-two-chars
      ORK_BASE_URL: https://ork.amtgard.com
      ORK_JSON_API_BASE_URL: ""
      ORK_CLAIM_MAIL_VIA_ORK: ""
      MAILBOX_CODE_PEPPER: integ-mailbox-pepper-not-for-production-use
      LOG_SPOOL_ENABLED: "true"
      LOG_ROOT: /var/www/idp.amtgard.com/logs/bundles-integ
      OAUTH_PRIVATE_KEY: /var/www/idp.amtgard.com/tests/fixtures/oidc/private.pem
      OAUTH_PUBLIC_KEY: /var/www/idp.amtgard.com/tests/fixtures/oidc/public.pem
      OAUTH_ENCRYPTION_KEY: integ-oauth-encryption-key-not-for-production
      OAUTH_AUTH_TOKEN_TTL: PT10M
      OAUTH_ACCESS_TOKEN_TTL: PT2H
      OAUTH_REFRESH_TOKEN_TTL: P1M
      AUTH_SERVER_DEFUSE_KEY: integ-auth-server-defuse-key-not-for-production
      APP_SECRET: integ-app-secret-not-for-production
      JWT_KEY: integ-jwt-key-not-for-production
